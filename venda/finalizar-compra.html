<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pagamento PIX - 6ª FPSS</title>

    <link rel="stylesheet" href="../css/base.css">
    <link rel="stylesheet" href="../css/layout.css">
    <link rel="stylesheet" href="../css/components.css">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="icon" type="image/png" href="/assets/icons/favicon.png">

    <script src="../js/qrcode.min.js"></script>

    <style>
        body{
            background:#f4f4f4;
            font-family:Arial,sans-serif;
        }

        .pix-container{
            max-width:650px;
            margin:30px auto;
            background:#fff;
            border-radius:16px;
            padding:30px;
            box-shadow:0 10px 30px rgba(0,0,0,0.12);
            border-top:6px solid #228b22;
        }

        h1{
            text-align:center;
            color:#8b1111;
            margin-bottom:10px;
        }

        .sub{
            text-align:center;
            color:#666;
            margin-bottom:25px;
        }

        .codigo-box{
            background:#f8f9fa;
            padding:15px;
            border-radius:10px;
            text-align:center;
            margin-bottom:20px;
            border:1px solid #ddd;
        }

        .codigo{
            font-size:22px;
            font-weight:bold;
            color:#8b1111;
        }

        .qrcode-area{
            display:flex;
            justify-content:center;
            margin:25px 0;
        }

        #qrcode{
            padding:15px;
            background:#fff;
            border:1px solid #ddd;
            border-radius:12px;
            min-height:220px;
            display:flex;
            align-items:center;
            justify-content:center;
        }

        .pix-copia{
            margin-top:20px;
        }

        .pix-copia textarea{
            width:100%;
            height:120px;
            padding:12px;
            border-radius:10px;
            border:1px solid #ccc;
            resize:none;
            font-size:14px;
        }

        .btn{
            width:100%;
            padding:16px;
            border:none;
            border-radius:10px;
            font-size:18px;
            font-weight:bold;
            cursor:pointer;
            margin-top:15px;
        }

        .btn-copiar{
            background:#228b22;
            color:#fff;
        }

        .btn-whatsapp{
            background:#25d366;
            color:#fff;
        }

        .btn-comprovante{
            background:#8b1111;
            color:#fff;
        }

        .status{
            margin-top:25px;
            text-align:center;
            font-size:18px;
            font-weight:bold;
            color:#d62828;
        }

        .info{
            margin-top:20px;
            background:#fff8d6;
            padding:15px;
            border-radius:10px;
            font-size:14px;
            line-height:1.6;
            border:1px solid #f4d35e;
        }

@media(max-width:768px){

    body{
        padding:4px;
        margin:0;
    }

    .pix-container{
        width:100%;
        max-width:100%;
        margin:8px auto;
        padding:12px;
        border-radius:10px;
        box-sizing:border-box;
    }

    h1{
        font-size:24px;
        margin-bottom:8px;
    }

    .sub{
        font-size:13px;
        margin-bottom:14px;
        line-height:1.4;
    }

    .codigo-box{
        padding:10px;
        margin-bottom:14px;
    }

    .codigo{
        font-size:20px;
        word-break:break-word;
    }

    #valorPedido{
        font-size:16px;
    }

    .qrcode-area{
        margin:14px 0;
    }

    #qrcode{
        padding:8px;
        min-height:auto;
    }

    #qrcode img,
    #qrcode canvas{
        width:150px !important;
        height:150px !important;
    }

    .pix-copia textarea{
        height:80px;
        font-size:12px;
        padding:8px;
    }

    .btn{
        padding:12px;
        font-size:15px;
        margin-top:10px;
        border-radius:8px;
    }

    .status{
        margin-top:16px;
        font-size:16px;
        line-height:1.4;
    }

    .info{
        margin-top:14px;
        padding:10px;
        font-size:12px;
        line-height:1.5;
    }

}

    </style>
</head>
<body>

<div class="pix-container">

    <h1>🚀 PIX Gerado com Sucesso</h1>

    <p class="sub" id="subtituloStatus">
        Escaneie o QR Code ou copie o código PIX
    </p>

    <div class="codigo-box">
        <div>Seu Pedido:</div>
        <div class="codigo" id="codigoPedido">Carregando...</div>
        <div id="valorPedido" style="margin-top:8px;font-weight:bold;"></div>
    </div>

    <div class="qrcode-area">
        <div id="qrcode"></div>
    </div>

    <div class="pix-copia" id="pixCopiaArea">
        <label id="labelPix"><strong>Código PIX Copia e Cola:</strong></label>

        <textarea id="pixCode" readonly></textarea>

        <button class="btn btn-copiar" id="btnCopiarPix" onclick="copiarPix()">
            📋 COPIAR CÓDIGO PIX
        </button>

        <button class="btn btn-comprovante" id="btnComprovante" onclick="gerarComprovante()" style="display:none;">
            📄 VISUALIZAR COMPROVANTE
        </button>
    </div>

    <div class="status" id="statusPagamento">
        ⏳ Aguardando pagamento...
    </div>

    <div class="info">
        ⚠️ <strong>IMPORTANTE:</strong><br>
        Após o pagamento, leve seu código de pedido + CPF para retirada.<br>
        Sem pagamento aprovado, a entrega não será liberada.
    </div>

</div>

<script>
const pixData = JSON.parse(localStorage.getItem("pixData"));

if (!pixData) {
    alert("❌ Nenhum pagamento encontrado.");
    window.location.href = "compra-churrasco.html";
}

document.getElementById("codigoPedido").innerText =
    pixData.codigo_pedido || "N/D";

document.getElementById("valorPedido").innerText =
    `Valor: R$ ${Number(pixData.total || 0).toFixed(2).replace(".", ",")}`;

document.getElementById("pixCode").value =
    pixData.pix_copia_cola || pixData.qr_code || "";

function gerarQr(texto) {
    document.getElementById("qrcode").innerHTML = "";

if (!texto || texto.trim() === "") {
    document.getElementById("qrcode").innerHTML =
        "<b>PIX não encontrado.</b>";
    return;
}

new QRCode(
    document.getElementById("qrcode"),
    {
        text: texto,
        width: 220,
        height: 220
    }
);
}

const codigoPix =
    pixData.pix_copia_cola || "";

document.getElementById("pixCode").value = codigoPix;

gerarQr(codigoPix);

function copiarPix() {
    const campo = document.getElementById("pixCode");
    campo.select();
    campo.setSelectionRange(0, 99999);
    navigator.clipboard.writeText(campo.value);
    alert("✅ Código copiado!");
}

function gerarComprovante() {

    if (
        (pixData.status_pagamento || "").toLowerCase() !== "pago" ||
        (pixData.status_retirada || "").toLowerCase() === "retirado"
    ) {
        alert("Este comprovante não está disponível.");
        return;
    }

    window.open("/venda/comprovante.html", "_blank");
}



async function verificarPagamento() {

    if (!pixData.txid) return;

    try {

        const res = await fetch(
            `https://api.festasaosebastiao.com.br/verificar-pagamento/${pixData.txid}`
        );

        const dados = await res.json();

        if (!dados.sucesso) return;

        pixData.status_pagamento = dados.status_interno || "";
        pixData.status_retirada = dados.status_retirada || "";

        pixData.qr_code_retirada =
            dados.qr_code_retirada || null;

        pixData.token_retirada =
            dados.token_retirada || null;


        localStorage.setItem(
            "pixData",
            JSON.stringify(pixData)
        );

        if (
            (dados.status_interno || "").toLowerCase() === "pago" &&
            (dados.status_retirada || "").toLowerCase() !== "retirado"
        ) {

            document.getElementById("statusPagamento").innerHTML =
                "✅ PAGAMENTO APROVADO!";

            document.getElementById("statusPagamento").style.color =
                "green";
            document.getElementById("btnComprovante").style.display =
                "block";

            document.getElementById("btnCopiarPix").style.display =
                "none";

            document.getElementById("labelPix").style.display =
                "none";

            document.getElementById("pixCode").style.display =
                "none";

            gerarQr(
            dados.qr_code_retirada || pixData.codigo_pedido
            );

            document.getElementById("subtituloStatus").innerHTML =
                "📦 Apresente este QR Code ou CPF para retirada";

        }

        else if (
            (dados.status_retirada || "").toLowerCase() === "retirado"
        ) {

            document.getElementById("statusPagamento").innerHTML =
                `🎉 PRODUTO JÁ RETIRADO<br><small>Retirado em: ${
                    dados.data_retirada ||
                    dados.updated_at ||
                    "Data não informada"
                }</small>`;

            document.getElementById("statusPagamento").style.color =
                "#8b1111";

            document.getElementById("btnComprovante").style.display =
                 "none";

            document.getElementById("pixCopiaArea").style.display =
                "none";

            document.getElementById("qrcode").innerHTML = `
                <div style="
                    padding:30px;
                    text-align:center;
                    font-size:22px;
                    color:#8b1111;
                    font-weight:bold;
                    border:2px solid #8b1111;
                    border-radius:12px;
                    background:#fff8ef;
                ">
                    🎉 PRODUTO JÁ RETIRADO
                    <br><br>
                    <span style="font-size:14px;">
                        ${
                            dados.data_retirada ||
                            dados.updated_at ||
                            ""
                        }
                    </span>
                </div>
            `;

            document.getElementById("subtituloStatus").innerHTML =
                "✅ Pedido finalizado";

        }

        else {

            document.getElementById("statusPagamento").innerHTML =
                "⏳ Aguardando pagamento...";

            document.getElementById("statusPagamento").style.color =
                "#d62828";

            document.getElementById("btnWhatsapp").style.display =
                "none";

            document.getElementById("btnComprovante").style.display =
                "none";

            document.getElementById("btnCopiarPix").style.display =
                "block";

            document.getElementById("labelPix").style.display =
                "block";

            document.getElementById("pixCode").style.display =
                "block";

            document.getElementById("subtituloStatus").innerHTML =
                "Escaneie o QR Code ou copie o código PIX";

            gerarQr(
    pixData.pix_copia_cola || pixData.qr_code || ""
);

        }

    } catch (e) {

        console.log("Erro ao verificar pagamento.", e);

    }

}

verificarPagamento();
setInterval(verificarPagamento, 5000);
</script>

</body>
</html>
