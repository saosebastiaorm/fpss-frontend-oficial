<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Central do Cliente - FPSS</title>

  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/layout.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/conversao-master.css">

  <style>
    body{
      background:linear-gradient(135deg,#8b1111,#c41515);
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:20px;
    }

    .cliente-box{
      width:100%;
      max-width:520px;
      background:#ffffff;
      border-radius:24px;
      padding:35px;
      box-shadow:0 15px 40px rgba(0,0,0,.25);
      border-top:6px solid #ffd700;
    }

    .cliente-topo{
      text-align:center;
      margin-bottom:28px;
    }

.logo-central{
      width:110px;
      height:110px;
      margin:0 auto 18px;
      border-radius:22px;
      border:4px solid #ffd700;
      background:#fff8dc;
      display:flex;
      align-items:center;
      justify-content:center;
      box-shadow:0 8px 18px rgba(0,0,0,.12);
      overflow:hidden;
}

.logo-central img{
      width:100%;
      height:100%;
      object-fit:cover;
}

    .cliente-topo h1{
      color:#8b1111;
      font-size:2rem;
      margin-bottom:8px;
    }

    .cliente-topo p{
      color:#555;
      font-weight:600;
    }

    .campo{
      margin-bottom:18px;
    }

    .campo label{
      display:block;
      font-weight:800;
      margin-bottom:8px;
      color:#333;
    }

    .campo input{
      width:100%;
      padding:14px;
      border:1px solid #ccc;
      border-radius:12px;
      font-size:1rem;
      box-sizing:border-box;
    }

    .btn-login{
      width:100%;
      padding:18px;
      border:none;
      border-radius:14px;
      background:linear-gradient(135deg,#1faa4a,#16a34a);
      color:#fff;
      font-size:1.2rem;
      font-weight:900;
      cursor:pointer;
      box-shadow:0 8px 18px rgba(0,0,0,.18);
    }

    .btn-login:hover{
      transform:translateY(-2px);
    }

    .ajuda-links{
      margin-top:20px;
      display:flex;
      flex-direction:column;
      gap:10px;
      text-align:center;
    }

    .ajuda-links a{
      color:#8b1111;
      font-weight:700;
      text-decoration:none;
    }

    .seguranca{
      margin-top:22px;
      background:#f8f9fa;
      padding:14px;
      border-radius:12px;
      font-size:.9rem;
      color:#555;
      text-align:center;
    }
  </style>
</head>
<body>

  <div class="cliente-box">

    <div class="cliente-topo">
        <div class="logo-central">
         <img src="../img/igreja-fpss.png" alt="FPSS">
        </div>
      <h1>🧾 Central do Cliente</h1>
      <p>Consulte seus pedidos, pagamentos e QR Code com segurança.</p>
    </div>

    <form id="loginCliente">

      <div class="campo">
        <label>CPF do comprador:</label>
        <input type="text" id="cpf" placeholder="000.000.000-00" maxlength="14" required>
      </div>

      <div class="campo">
       <label>WhatsApp do comprador:</label>
        <input type="tel" id="whatsapp" placeholder="(69) 99999-9999" required>
      </div>

      <button type="submit" class="btn-login">
        🔐 ACESSAR MEUS PEDIDOS
      </button>

    </form>

    <div class="ajuda-links">
      <a href="../index.html">🏠 Voltar ao site</a>
      <a href="https://wa.me/5569981102306" target="_blank">📲 Preciso de ajuda no WhatsApp</a>
    </div>

    <div class="seguranca">
     🔒 Seus dados são protegidos. Apenas CPF + WhatsApp cadastrado liberam acesso.

  </div>
  <script src="../js/cliente-login.js"></script>
</body>
</html>
