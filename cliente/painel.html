<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Painel do Cliente - FPSS</title>

  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/layout.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/conversao-master.css">
  <link rel="stylesheet" href="../css/painel-cliente.css">

  <style>
    *{
      box-sizing:border-box;
    }

    body{
      margin:0;
      background:linear-gradient(180deg,#f7f1e8,#efe4d1);
      padding:20px;
      font-family:Arial,sans-serif;
      color:#333;
    }

    .painel-box{
      max-width:980px;
      margin:auto;
      background:#ffffff;
      padding:35px;
      border-radius:28px;
      box-shadow:0 18px 45px rgba(0,0,0,.12);
      border-top:8px solid #ffd700;
    }

    .painel-header{
      text-align:center;
      margin-bottom:30px;
      padding-bottom:20px;
      border-bottom:2px solid #f3e2b8;
    }

    .painel-header h1{
      color:#8b1111;
      margin:0;
      font-size:2.2rem;
    }

    .painel-header p{
      margin-top:8px;
      color:#666;
      font-size:1rem;
      font-weight:600;
    }

    .cliente-info{
      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
      gap:16px;
      margin-bottom:30px;
      padding:22px;
      background:linear-gradient(135deg,#fffaf0,#f8f3ea);
      border-radius:18px;
      border:1px solid #ecd9b0;
    }

    .cliente-info p{
      margin:0;
      font-size:15px;
      line-height:1.5;
    }

    #clientePedidos{
      display:grid;
      gap:18px;
    }

    .pedido-card{
      background:#fff8ef;
      border:1px solid #f0d8b0;
      border-left:6px solid #ffd700;
      border-radius:18px;
      padding:20px;
      transition:.25s;
      box-shadow:0 6px 14px rgba(0,0,0,.05);
    }
.pedido-pago{
  border-left:6px solid #16a34a !important;
  background:#f0fff4 !important;
}

.pedido-pendente{
  border-left:6px solid #f59e0b !important;
  background:#fffaf0 !important;
}

.pedido-retirado{
  border-left:6px solid #2563eb !important;
  background:#eff6ff !important;
}
    .pedido-card:hover{
      transform:translateY(-3px);
    }

    .pedido-card h3{
      color:#8b1111;
      margin-top:0;
      margin-bottom:12px;
      font-size:1.2rem;
    }

    .pedido-card p{
      margin:6px 0;
      font-size:15px;
    }

    .resumo-cliente{
      background:linear-gradient(135deg,#8b1111,#b71c1c);
      color:#fff;
      border:none;
      border-left:none;
    }

    .resumo-cliente h3,
    .resumo-cliente p{
      color:#fff;
    }

    .logout-btn{
      width:100%;
      margin-top:35px;
      padding:18px;
      border:none;
      border-radius:16px;
      background:linear-gradient(135deg,#8b1111,#b71c1c);
      color:#fff;
      font-size:18px;
      font-weight:900;
      cursor:pointer;
      box-shadow:0 10px 20px rgba(139,17,17,.25);
      transition:.25s;
    }

    .logout-btn:hover{
      transform:translateY(-2px);
    }

    @media(max-width:768px){

      body{
        padding:12px;
      }

      .painel-box{
        padding:22px;
        border-radius:22px;
      }

      .painel-header h1{
        font-size:1.7rem;
      }

      .cliente-info{
        grid-template-columns:1fr;
      }

      .pedido-card{
        padding:16px;
      }

      .logout-btn{
        font-size:16px;
        padding:16px;
      }

    }

.filtros-pedidos{
  display:flex;
  flex-wrap:wrap;
  gap:10px;
  margin-bottom:25px;
  justify-content:center;
}

.filtro-btn{
  padding:10px 18px;
  border:none;
  border-radius:12px;
  cursor:pointer;
  font-weight:800;
  background:#f3e2b8;
  color:#8b1111;
  transition:.2s;
}

.filtro-btn:hover{
  transform:translateY(-2px);
}

.filtro-btn.ativo{
  background:#8b1111;
  color:#fff;
}
.pedido-topo{
  display:flex;
  gap:20px;
  align-items:flex-start;
}

.pedido-imagem{
  width:120px;
  height:120px;
  object-fit:cover;
  border-radius:12px;
  border:2px solid #facc15;
  flex-shrink:0;
}

.pedido-info{
  flex:1;
}

@media(max-width:768px){

  .pedido-topo{
    flex-direction:column;
  }

  .pedido-imagem{
    width:100%;
    height:180px;
  }

}

/* ======================================
   MODAL QR RETIRADA
====================================== */

.btn-ver-qr{
  margin-top:12px;
  padding:10px 14px;
  border:none;
  border-radius:10px;
  background:#16a34a;
  color:#fff;
  font-weight:700;
  cursor:pointer;
  transition:.2s;
}

.btn-ver-qr:hover{
  transform:translateY(-2px);
}

#modalQRRetirada{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.75);
  display:flex;
  justify-content:center;
  align-items:center;
  z-index:99999;
}

.modal-qr-conteudo{
  background:#ffffff;
  width:95%;
  max-width:820px;

  max-height:85vh;
  overflow-y:auto;

  border-radius:18px;
  padding:30px;
  text-align:center;
  position:relative;

  box-shadow:0 20px 50px rgba(0,0,0,.3);
}

.modal-qr-conteudo h2{
  margin-bottom:15px;
  color:#991b1b;
}


.fechar-modal{
  position:absolute;
  top:12px;
  right:12px;
  width:36px;
  height:36px;
  border:none;
  border-radius:50%;
  background:#ef4444;
  color:#fff;
  cursor:pointer;
  font-size:18px;
  font-weight:700;
}

.btn-download-qr{
  margin:15px 0;
  padding:10px 16px;
  border:none;
  border-radius:10px;
  background:#2563eb;
  color:#fff;
  font-weight:700;
  cursor:pointer;
  transition:.2s;
}
.btn-imprimir-qr{
  margin-top:8px;
  padding:10px 16px;
  border:none;
  border-radius:10px;
  background:#16a34a;
  color:#fff;
  font-weight:700;
  cursor:pointer;
}
.btn-download-qr:hover{
  transform:translateY(-2px);
}

.imagem-produto-qr{
  width:120px;
  height:120px;
  object-fit:cover;
  border-radius:12px;
  margin:10px auto;
  display:block;
  border:3px solid #facc15;
}

.titulo-produto-qr{
  text-align:center;
  color:#991b1b;
  margin-bottom:15px;
}

.dados-retirada{
  margin-top:20px;
  text-align:center;
}
.dados-retirada-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:10px;
  margin-top:15px;
}

.dado-item{
  background:#ffffff;
  border:1px solid #e5e7eb;
  border-radius:10px;
  padding:10px;
  text-align:center;
  box-shadow:0 2px 5px rgba(0,0,0,.05);
}

.dado-item strong{
  display:block;
  font-size:13px;
  color:#991b1b;
  margin-bottom:4px;
  font-weight:800;
}

.dado-item span{
  font-size:14px;
  font-weight:700;
  color:#222;
}

@media(max-width:768px){

  .dados-retirada-grid{
    grid-template-columns:1fr;
  }

}
.dados-retirada p{
  margin-bottom:10px;
  font-size:15px;
}



.imagem-produto-qr{
  width:120px;
  height:120px;
  object-fit:cover;
  border-radius:12px;
  border:3px solid #facc15;
  margin:10px auto;
  display:block;
}

.horario-retirada-box{
  background:#fef3c7;
  color:#92400e;
  font-weight:800;
  font-size:18px;
  padding:12px;
  border-radius:10px;
  margin:15px 0;
  text-align:center;
}

.status-pago-box{
  background:#dcfce7;
  color:#166534;
  font-weight:800;
  padding:12px;
  border-radius:10px;
  margin:15px 0;
  text-align:center;
}

.titulo-produto-qr{
  text-align:center;
  font-size:28px;
  font-weight:800;
  color:#991b1b;
  margin-bottom:15px;
}

.qr-topo{
  display:flex;
  gap:25px;
  align-items:flex-start;
  justify-content:center;
  margin-bottom:20px;
}

.qr-lado-esquerdo{
  flex:1;
  text-align:center;
}

.qr-lado-direito{
  flex:1;
  text-align:center;
}
#qrcodeCliente{
    text-align:center;
    margin:25px auto 25px auto;
}
.aviso-retirada{
    background:#fff3cd;
    border:1px solid #ffe69c;
    padding:12px;
    border-radius:8px;
    text-align:center;
    font-weight:700;
    margin-top:15px;
}
.aviso-retirada{
    margin-top:20px;
}
#qrcodeCliente canvas,
#qrcodeCliente img{
    width:200px !important;
    height:200px !important;
    display:block;
    margin:25px auto;
}

#qrcodeCliente{
    margin-bottom:15px;
        margin:15px 0;
}


@media(max-width:768px){

  .qr-topo{
    flex-direction:column;
  }

}

.qr-cabecalho{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:30px;
  margin-bottom:20px;
}

.qr-lado-direito{
  width:50%;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
}

.qr-lado-direito{
  width:50%;
  text-align:center;
}

.qr-lado-direito #qrcodeCliente{
  display:flex;
  justify-content:center;
}

.qr-lado-direito .btn-download-qr{
  margin-top:12px;
}
.aviso-retirada{
  margin-top:15px;
  background:#fef3c7;
  color:#92400e;
  font-weight:700;
  border-radius:10px;
  padding:12px;
  text-align:center;
}

@media print {

  body *{
    visibility:hidden;
  }

  #modalQRRetirada,
  #modalQRRetirada *{
    visibility:visible;
  }
  #qrcodeCliente canvas,
  #qrcodeCliente img{
  
    width:140px !important;
    height:140px !important;
  }
  #modalQRRetirada{
    position:absolute;
    left:0;
    top:0;
    width:100%;
    background:#fff;
  }

  .modal-qr-conteudo{
    width:100% !important;
    max-width:700px !important;
    margin:auto !important;

    max-height:none !important;
    overflow:visible !important;

    box-shadow:none !important;
    border:none !important;
  }

  .fechar-modal,
  .btn-download-qr,
  .btn-imprimir-qr{
    display:none !important;
  }

  .qr-cabecalho{
    gap:15px !important;
  }


@media print {

  .imagem-produto-qr{
      width:55px !important;
      height:55px !important;
      max-width:40px !important;
      object-fit:cover !important;
  }

}

  .dados-retirada-grid{
    gap:6px !important;
  }

  .dado-item{
    padding:6px !important;
    
  }

}
  </style>

</head>
<body>

  <div class="painel-box">

    <div class="painel-header">
      <h1>📄 Meus Pedidos FPSS</h1>
      <p>Acompanhe pagamentos, retirada e histórico completo.</p>
    </div>

    <div class="cliente-info">
      <p><strong>👤 Nome:</strong> <span id="clienteNome"></span></p>
      <p><strong>🪪 CPF:</strong> <span id="clienteCPF"></span></p>
      <p><strong>📲 WhatsApp:</strong> <span id="clienteWhatsApp"></span></p>
    </div>

    <div class="filtros-pedidos">
  <button class="filtro-btn ativo" data-filtro="todos">Todos</button>
  <button class="filtro-btn" data-filtro="pago">Pagos</button>
  <button class="filtro-btn" data-filtro="pendente">Pendentes</button>
  <button class="filtro-btn" data-filtro="retirado">Retirados</button>
</div>

<div id="clientePedidos"></div>

    <button id="logoutCliente" class="logout-btn">
      🚪 Sair da Central
    </button>

  </div>
  
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script src="../js/cliente-painel.js?v=4"></script>

</body>
</html>
