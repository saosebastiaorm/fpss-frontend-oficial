<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Painel do Cliente - FPSS</title>

  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/layout.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/conversao-master.css">

  <style>
    body{
      background:#f7f1e8;
      padding:20px;
      font-family:Arial, sans-serif;
    }

    .painel-box{
      max-width:900px;
      margin:auto;
      background:#fff;
      padding:35px;
      border-radius:24px;
      box-shadow:0 12px 30px rgba(0,0,0,.12);
      border-top:6px solid #ffd700;
    }

    h1{
      color:#8b1111;
      text-align:center;
      margin-bottom:25px;
    }

    .cliente-info{
      display:grid;
      gap:12px;
      margin-bottom:30px;
      padding:20px;
      background:#f8f8f8;
      border-radius:16px;
    }

    .cliente-info p{
      margin:0;
      font-size:16px;
    }

    #clientePedidos{
      display:grid;
      gap:16px;
    }

    .pedido-card{
      background:#fff8ef;
      border:1px solid #f0d8b0;
      border-radius:16px;
      padding:18px;
    }

    .pedido-card h3{
      color:#8b1111;
      margin-bottom:10px;
    }

    .logout-btn{
      width:100%;
      margin-top:30px;
      padding:16px;
      border:none;
      border-radius:14px;
      background:#8b1111;
      color:#fff;
      font-size:18px;
      font-weight:900;
      cursor:pointer;
    }
  </style>

</head>
<body>

  <div class="painel-box">

    <h1>📄 Meus Pedidos FPSS</h1>

    <div class="cliente-info">
      <p><strong>Nome:</strong> <span id="clienteNome"></span></p>
      <p><strong>CPF:</strong> <span id="clienteCPF"></span></p>
      <p><strong>WhatsApp:</strong> <span id="clienteWhatsApp"></span></p>
    </div>

    <div id="clientePedidos"></div>

    <button id="logoutCliente" class="logout-btn">
      🚪 Sair da Central
    </button>

  </div>

  <script src="../js/cliente-painel.js"></script>

</body>
</html>
