<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Administrativo FPSS</title>
    <link rel="icon" type="image/png" href="/assets/icons/favicon.png">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Merriweather:wght@700;900&family=Roboto:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/admin-shared.css">
</head>
<body class="admin-page admin-auth">

<div class="login-container">
    <div class="login-box">
        <div class="logo-area">🏰</div>
        <h1>FPSS ADMIN</h1>
        <p>Painel de Controle Oficial</p>

        <form id="loginForm">
            <div class="input-group">
                <label for="email">E-mail de Acesso</label>
                <input type="email" id="email" required placeholder="exemplo@fpss.com">
            </div>

            <div class="input-group">
                <label for="senha">Senha Segura</label>
                <input type="password" id="senha" required placeholder="••••••••">
            </div>

            <button type="submit" id="btnLogin">Entrar no Painel</button>
<div style="margin-top:15px;text-align:center;">
    <a href="recuperar-senha.html">
        Esqueceu sua senha?
    </a>
</div>

        </form>

        <div id="mensagemErro"></div>
    </div>
</div>

<script src="/js/login.js"></script>
</body>
</html>
