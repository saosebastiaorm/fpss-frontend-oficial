<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Leitor QR FPSS</title>
  <link rel="icon" type="image/png" href="/assets/icons/favicon.png">

  <script src="/js/html5-qrcode.min.js"></script>

  <style>
    *{
      box-sizing:border-box;
    }

    body{
      font-family:Arial,sans-serif;
      background:#f4f4f4;
      margin:0;
      padding:20px;
    }

    .container{
      max-width:900px;
      margin:auto;
      background:#fff;
      padding:25px;
      border-radius:15px;
      box-shadow:0 8px 25px rgba(0,0,0,0.15);
      text-align:center;
      border-top:5px solid #8b1111;
    }

    h1{
      color:#8b1111;
      margin-bottom:10px;
    }

    .sub{
      color:#666;
      margin-bottom:20px;
    }

    .top-nav{
      display:flex;
      flex-wrap:wrap;
      gap:10px;
      justify-content:center;
      margin-bottom:25px;
    }

    .top-nav a{
      text-decoration:none;
      background:#8b1111;
      color:#fff;
      padding:10px 16px;
      border-radius:10px;
      font-weight:bold;
    }

    .top-nav a:hover{
      opacity:0.92;
    }

    #reader{
      margin-top:20px;
      width:100%;
    }

    #reader video{
      width:100% !important;
      border-radius:12px;
    }

    .resultado{
      margin-top:25px;
      padding:20px;
      background:#fafafa;
      border-radius:10px;
      display:none;
      text-align:left;
      border:1px solid #ddd;
    }

    .erro{
      color:red;
      font-weight:bold;
      margin-top:15px;
    }

    .ok{
      color:green;
      font-weight:bold;
    }

    button{
      width:100%;
      padding:16px;
      margin-top:15px;
      border:none;
      border-radius:10px;
      font-size:18px;
      font-weight:bold;
      cursor:pointer;
      background:#1d7f2a;
      color:#fff;
    }

    button:hover{
      opacity:0.95;
    }

    .linha{
      margin-bottom:10px;
      font-size:17px;
    }

    .bloqueio{
      color:red;
      font-weight:bold;
      font-size:18px;
      margin-top:15px;
    }

    .sucesso{
      color:green;
      font-weight:bold;
      font-size:18px;
      margin-top:15px;
    }

    .btn-trocar-camera{
      margin-top:15px;
      background:#007bff;
      color:#fff;
      border:none;
      padding:12px 20px;
      border-radius:10px;
      cursor:pointer;
      font-weight:bold;
      font-size:16px;
    }

    .btn-trocar-camera:hover{
      opacity:0.9;
    }

    /* Remove botão flutuante no admin */
    .admin-page .botao-flutuante,
    .admin-page .botao-comprar-flutuante,
    .admin-page .comprar-flutuante{
      display:none !important;
    }

    @media(max-width:768px){
      body{
        padding:10px;
      }

      .container{
        padding:18px;
      }

      h1{
        font-size:42px;
      }

      .top-nav a{
        flex:1 1 calc(50% - 10px);
        text-align:center;
      }
    }
  </style>
</head>
<body class="admin-page">

<div class="container">

  <h1>📷 Leitor QR Code FPSS</h1>
  <p class="sub">Aponte para o QR Code de retirada</p>

  <div class="top-nav">
    <a href="/admin/dashboard.html">Admin Central</a>
    <a href="/admin/dashboard-metricas.html">Dashboard</a>
    <a href="/admin/pedidos.html">Pedidos</a>
    <a href="/admin/produtos.html">Produtos</a>
    <a href="/admin/retirada.html">Retirada Manual</a>
    <a href="/index.html">Site Oficial</a>
  </div>

  <div id="reader"></div>

  <button class="btn-trocar-camera" onclick="trocarCamera()">
    🔄 Trocar Câmera
  </button>

  <div id="erro" class="erro"></div>

  <div id="resultado" class="resultado"></div>

</div>

<script>
const API_BASE = "https://api.festasaosebastiao.com.br";

let pedidoAtual = null;
let leituraEmProcesso = false;

let html5QrCode = null;
let cameras = [];
let currentCameraIndex = 0;

/* =========================================
   PROCESSAR QR
========================================= */
async function onScanSuccess(decodedText) {

  if (leituraEmProcesso) return;

  leituraEmProcesso = true;

  try {

    document.getElementById("erro").innerHTML = "";

    const partes = decodedText.split("|");

    if (!partes[0]) {
      document.getElementById("erro").innerHTML = "❌ QR inválido.";
      leituraEmProcesso = false;
      return;
    }

    const codigoPedido = partes[0];

    const res = await fetch(
      `${API_BASE}/pedido/codigo/${encodeURIComponent(codigoPedido)}`
    );

    const dados = await res.json();

    if (!dados.sucesso) {
      document.getElementById("erro").innerHTML = "❌ Pedido não encontrado.";
      leituraEmProcesso = false;
      return;
    }

    pedidoAtual = dados.pedido;

    if (pedidoAtual.payment_id) {
      try {
        const pagamento = await fetch(
          `${API_BASE}/verificar-pagamento/${pedidoAtual.payment_id}`
        );

        const pagamentoDados = await pagamento.json();

        if (pagamentoDados.sucesso) {
          pedidoAtual.status_pagamento = pagamentoDados.status_interno;
        }

      } catch(e){}
    }

    document.getElementById("resultado").style.display = "block";

    document.getElementById("resultado").innerHTML = `
      <h2>🎟️ Pedido Encontrado</h2>

      <div class="linha"><strong>Nome:</strong> ${pedidoAtual.nome} ${pedidoAtual.sobrenome || ""}</div>

      <div class="linha"><strong>Código:</strong> ${pedidoAtual.codigo_pedido}</div>

      <div class="linha"><strong>CPF:</strong> ${pedidoAtual.cpf}</div>

      <div class="linha"><strong>Quantidade:</strong> ${pedidoAtual.quantidade}</div>

      <div class="linha"><strong>Horário:</strong> ${pedidoAtual.horario_retirada || "Não definido"}</div>

      <div class="linha"><strong>Status Pagamento:</strong> ${pedidoAtual.status_pagamento}</div>

      <div class="linha"><strong>Status Retirada:</strong> ${pedidoAtual.status_retirada}</div>

      ${
        pedidoAtual.status_retirada === "retirado"
          ? `<div class="bloqueio">⚠️ PEDIDO JÁ RETIRADO</div>`
          : pedidoAtual.status_pagamento !== "pago"
            ? `<div class="bloqueio">⚠️ PAGAMENTO PENDENTE — ENTREGA BLOQUEADA</div>`
            : `<button onclick="confirmarRetirada()">✅ CONFIRMAR ENTREGA</button>`
      }
    `;

  } catch (e) {

    document.getElementById("erro").innerHTML = "❌ Erro na leitura.";

  } finally {

    setTimeout(() => {
      leituraEmProcesso = false;
    }, 2000);
  }
}

/* =========================================
   CONFIRMAR ENTREGA
========================================= */
async function confirmarRetirada() {

  if (!pedidoAtual) return;

  const confirmar = confirm(
    `Confirmar entrega para ${pedidoAtual.nome}?\n\nCódigo: ${pedidoAtual.codigo_pedido}`
  );

  if (!confirmar) return;

  try {

    const res = await fetch(
      `${API_BASE}/retirada/${pedidoAtual.codigo_pedido}`,
      {
        method:"POST"
      }
    );

    const dados = await res.json();

    if (dados.sucesso) {

      alert("✅ Entrega confirmada com sucesso!");
      location.reload();

    } else {

      alert("❌ " + dados.erro);
    }

  } catch (e) {

    alert("❌ Erro ao confirmar retirada.");
  }
}

/* =========================================
   START CAMERA
========================================= */
async function iniciarLeitor() {

  try {

    html5QrCode = new Html5Qrcode("reader");

    cameras = await Html5Qrcode.getCameras();

    if (!cameras || !cameras.length) {
      document.getElementById("erro").innerHTML =
        "❌ Nenhuma câmera encontrada.";
      return;
    }

    const traseiraIndex = cameras.findIndex(camera =>
      camera.label.toLowerCase().includes("back") ||
      camera.label.toLowerCase().includes("rear") ||
      camera.label.toLowerCase().includes("environment") ||
      camera.label.toLowerCase().includes("traseira")
    );

    currentCameraIndex = traseiraIndex >= 0 ? traseiraIndex : 0;

    await html5QrCode.start(
      { deviceId: { exact: cameras[currentCameraIndex].id } },
      {
        fps: 10,
        qrbox: { width: 250, height: 250 },
        facingMode: "environment"
      },
      onScanSuccess
    );

  } catch (err) {

    document.getElementById("erro").innerHTML =
      "❌ Câmera não encontrada ou permissão negada.";
  }
}

/* =========================================
   TROCAR CÂMERA
========================================= */
async function trocarCamera() {

  if (!cameras.length || cameras.length < 2) {
    alert("❌ Apenas uma câmera disponível.");
    return;
  }

  try {

    await html5QrCode.stop();

    currentCameraIndex =
      (currentCameraIndex + 1) % cameras.length;

    await html5QrCode.start(
      { deviceId: { exact: cameras[currentCameraIndex].id } },
      {
        fps: 10,
        qrbox: { width: 250, height: 250 }
      },
      onScanSuccess
    );

  } catch (err) {

    alert("❌ Erro ao trocar câmera.");
  }
}

/* =========================================
   INIT
========================================= */
iniciarLeitor();
</script>

</body>
</html>
