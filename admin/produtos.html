<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FPSS Admin - Produtos</title>

  <link rel="stylesheet" href="../css/produtos.css">
</head>
<body>

<div class="container">

  <div class="topo">
    <h1>🛒 FPSS Admin - Produtos</h1>
    <button class="btn-novo" onclick="novoProduto()">➕ Novo Produto</button>
  </div>

  <div class="menu-admin">
    <a href="/admin/dashboard.html">Admin Central</a>
    <a href="/admin/dashboard-metricas.html">Dashboard</a>
    <a href="/admin/produtos.html" class="ativo">Produtos</a>
    <a href="/admin/retirada.html">Retirada</a>
    <a href="/admin/leitor.html">Leitor QR</a>
    <a href="/">Site Oficial</a>
  </div>

  <div class="card">

    <input type="hidden" id="produtoId">

    <div class="grid">

      <div>
        <label>Código</label>
        <input type="text" id="codigo">
      </div>

      <div>
        <label>Nome</label>
        <input type="text" id="nome">
      </div>

      <div>
        <label>Preço</label>
        <input type="number" id="preco" step="0.01">
      </div>

      <div>
        <label>Estoque</label>
        <input type="number" id="estoque">
      </div>

      <div>
        <label>Tipo</label>
        <select id="tipo">
          <option value="produto">Produto</option>
          <option value="doacao">Doação</option>
          <option value="ingresso">Ingresso</option>
        </select>
      </div>

      <div>
        <label>Ordem</label>
        <input type="number" id="ordem">
      </div>

      <div>
        <label>Status</label>
        <select id="ativo">
          <option value="true">Ativo</option>
          <option value="false">Inativo</option>
        </select>
      </div>

    </div>

    <div style="margin-top:20px;">
      <label>Imagem do Produto</label>

      <div class="upload-horizontal">

        <input
          type="text"
          id="imagem"
          placeholder="URL da imagem será preenchida automaticamente"
          readonly
        >

        <label class="file-label">
          📁 Escolher Imagem
          <input
            type="file"
            id="imagemArquivo"
            accept="image/*"
          >
        </label>

        <input
          type="text"
          id="nomeArquivo"
          placeholder="Nome do arquivo (ex: churrasco-oficial)"
        >

        <button
          type="button"
          class="btn-upload"
          onclick="uploadImagemProduto()"
        >
          🚀 Enviar
        </button>

      </div>

      <small id="statusUploadImagem"></small>
    </div>

    <div style="margin-top:20px;">
      <label>Descrição</label>
      <textarea id="descricao"></textarea>
    </div>

    <div style="margin-top:20px;">
      <button onclick="salvarProduto()">💾 SALVAR PRODUTO</button>
    </div>

  </div>

  <table>
    <thead>
      <tr>
        <th>Código</th>
        <th>Imagem</th>
        <th>Nome</th>
        <th>Preço</th>
        <th>Estoque</th>
        <th>Tipo</th>
        <th>Status</th>
        <th>Ordem</th>
        <th>Ações</th>
      </tr>
    </thead>

    <tbody id="tabelaProdutos">
      <tr>
        <td colspan="9">Carregando...</td>
      </tr>
    </tbody>
  </table>

</div>

<script src="../js/produtos.js"></script>

</body>
</html>
