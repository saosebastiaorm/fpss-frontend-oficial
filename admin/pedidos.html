<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pedidos FPSS</title>
  <link rel="icon" type="image/png" href="/assets/icons/favicon.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Merriweather:wght@700;900&family=Roboto:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/admin-shared.css">
</head>
<body class="admin-page">

<div class="container">

  <h1>📋 Pedidos 6ª FPSS 2027</h1>
  <p class="sub">Controle completo de compradores</p>

      <div class="menu-admin">
    <a href="/admin/dashboard.html">Admin Central</a>
    <a href="/admin/dashboard-metricas.html">Dashboard</a>
    <a href="/admin/produtos.html">Produtos</a>
    <a href="/admin/parceiros.html">Parceiros</a>
    <a href="/admin/pedidos.html" class="ativo">Pedidos</a>
    <a href="/admin/retirada.html">Retirada</a>
    <a href="/admin/leitor.html">Leitor</a>
    <a href="/admin/usuarios.html">Usuários</a>
    <a href="/">Site Oficial</a>
  </div>

  <div id="erro" class="erro"></div>

  <input
    type="text"
    id="busca"
    class="busca"
    placeholder="Buscar por nome, CPF, código..."
    oninput="filtrarPedidos()"
  >

  <div class="grid filtros-linha">

    <div>
      <label>Tipo de Produto</label>
      <select id="filtroTipoProduto" onchange="filtrarPedidos()">
        <option value="">Todos</option>
      </select>
    </div>

    <div>
      <label>Status de Pagamento</label>
      <select id="filtroPagamento" onchange="filtrarPedidos()">
        <option value="">Todos</option>
        <option value="pago">Pago</option>
        <option value="pendente">Pendente</option>
      </select>
    </div>

    <div>
      <label>Status de Retirada</label>
      <select id="filtroRetirada" onchange="filtrarPedidos()">
        <option value="">Todos</option>
      </select>
    </div>

    <div>
      <label>Horário de Retirada (de)</label>
      <input type="time" id="filtroHorarioDe" onchange="filtrarPedidos()">
    </div>

    <div>
      <label>Horário de Retirada (até)</label>
      <input type="time" id="filtroHorarioAte" onchange="filtrarPedidos()">
    </div>

  </div>

  <div class="grid filtros-linha">

    <div>
      <label>Data de Compra (de)</label>
      <input type="date" id="filtroCompraDe" onchange="filtrarPedidos()">
    </div>

    <div>
      <label>Data de Compra (até)</label>
      <input type="date" id="filtroCompraAte" onchange="filtrarPedidos()">
    </div>

    <div>
      <label>Data de Pagamento (de)</label>
      <input type="date" id="filtroPagamentoDe" onchange="filtrarPedidos()">
    </div>

    <div>
      <label>Data de Pagamento (até)</label>
      <input type="date" id="filtroPagamentoAte" onchange="filtrarPedidos()">
    </div>

  </div>

  <div class="topbar">
    <button onclick="carregarPedidos()">🔄 Atualizar</button>
    <button onclick="exportarCSV()">📁 Exportar CSV</button>
    <button onclick="limparFiltros()" class="btn-secundario">🧹 Limpar Filtros</button>
  </div>

  <div class="contador" id="contador">
    Carregando...
  </div>

  <div class="tabela-wrap">

    <table>

      <thead>
        <tr>
          <th>ID</th>
          <th>Código</th>
          <th>Produto</th>
          <th>Nome</th>
          <th>CPF</th>
          <th>Telefone</th>
          <th>Qtd</th>
          <th>Total</th>
          <th>Pagamento</th>
          <th>Retirada</th>
          <th>Horário</th>
        </tr>
      </thead>

      <tbody id="tabelaPedidos"></tbody>

    </table>

  </div>

</div>

<script>
const API_BASE = "https://api.festasaosebastiao.com.br";

let pedidosOriginais = [];

/* =========================================
   MOEDA
========================================= */
function moeda(valor) {
  return "R$ " + Number(valor || 0)
    .toFixed(2)
    .replace(".", ",");
}

/* =========================================
   RENDER
========================================= */
function renderPedidos(lista) {

  const tabela = document.getElementById("tabelaPedidos");

  tabela.innerHTML = "";

  document.getElementById("contador").innerText =
    `Total exibido: ${lista.length}`;

  lista.forEach(pedido => {

    tabela.innerHTML += `
      <tr>
        <td>${pedido.id}</td>

        <td>${pedido.codigo_pedido || "-"}</td>

        <td>${pedido.produto_tipo || "-"}</td>

        <td>${pedido.nome} ${pedido.sobrenome || ""}</td>

        <td>${pedido.cpf || "-"}</td>

        <td>${pedido.telefone || "-"}</td>

        <td>${pedido.quantidade || 0}</td>

        <td>${moeda(pedido.valor_total)}</td>

        <td class="${
          pedido.status_pagamento === "pago"
            ? "pago"
            : "pendente"
        }">
          ${pedido.status_pagamento || "pendente"}
        </td>

        <td class="${
          pedido.status_retirada === "retirado"
            ? "retirado"
            : ""
        }">
          ${pedido.status_retirada || "nao_retirado"}
        </td>

        <td>${pedido.horario_retirada || "-"}</td>
      </tr>
    `;
  });
}

let pedidosFiltrados = [];

/* =========================================
   CARREGAR
========================================= */
async function carregarPedidos() {

  try {

    document.getElementById("erro").innerHTML = "";

    const res = await fetch(
      `${API_BASE}/admin/pedidos`
    );

    const dados = await res.json();

    if (!dados.sucesso) {
      document.getElementById("erro").innerHTML =
        "❌ Erro ao carregar pedidos.";
      return;
    }

    pedidosOriginais = dados.pedidos || [];

    popularFiltrosDinamicos();
    filtrarPedidos();

  } catch (e) {

    document.getElementById("erro").innerHTML =
      "❌ Erro de conexão com servidor.";
  }
}

/* =========================================
   POPULAR OPÇÕES DOS FILTROS (com base nos
   valores reais que existem nos pedidos carregados)
========================================= */
function popularFiltrosDinamicos() {

  function popular(id, valores) {
    const select = document.getElementById(id);
    const valorAtual = select.value;

    select.innerHTML =
      '<option value="">Todos</option>' +
      valores
        .map(v => `<option value="${v}">${v}</option>`)
        .join("");

    if (valores.includes(valorAtual)) {
      select.value = valorAtual;
    }
  }

  const tipos = [...new Set(
    pedidosOriginais.map(p => p.produto_tipo).filter(Boolean)
  )].sort();

  const retiradas = [...new Set(
    pedidosOriginais.map(p => p.status_retirada).filter(Boolean)
  )].sort();

  popular("filtroTipoProduto", tipos);
  popular("filtroRetirada", retiradas);
}

/* =========================================
   COMPARA UMA DATA (timestamp ISO) CONTRA
   UM INTERVALO de/até (inputs type="date")
========================================= */
function dataDentroDoIntervalo(dataISO, de, ate) {

  if (!de && !ate) return true;

  if (!dataISO) return false;

  const dataSomente = String(dataISO).slice(0, 10);

  if (de && dataSomente < de) return false;
  if (ate && dataSomente > ate) return false;

  return true;
}

/* =========================================
   COMPARA UM HORÁRIO ("HH:MM") CONTRA UM
   INTERVALO de/até (inputs type="time")
========================================= */
function horarioDentroDoIntervalo(horario, de, ate) {

  if (!de && !ate) return true;

  if (!horario) return false;

  // garante "HH:MM" mesmo se vier "HH:MM:SS"
  const horarioCurto = String(horario).slice(0, 5);

  if (de && horarioCurto < de) return false;
  if (ate && horarioCurto > ate) return false;

  return true;
}

/* =========================================
   FILTRO (busca livre + todos os filtros)
========================================= */
function filtrarPedidos() {

  const termo = document.getElementById("busca")
    .value
    .toLowerCase()
    .trim();

  const tipoProduto = document.getElementById("filtroTipoProduto").value;
  const statusPagamento = document.getElementById("filtroPagamento").value;
  const statusRetirada = document.getElementById("filtroRetirada").value;

  const horarioDe = document.getElementById("filtroHorarioDe").value;
  const horarioAte = document.getElementById("filtroHorarioAte").value;

  const compraDe = document.getElementById("filtroCompraDe").value;
  const compraAte = document.getElementById("filtroCompraAte").value;
  const pagamentoDe = document.getElementById("filtroPagamentoDe").value;
  const pagamentoAte = document.getElementById("filtroPagamentoAte").value;

  const filtrados = pedidosOriginais.filter(p => {

    if (termo) {
      const bate =
        String(p.nome || "").toLowerCase().includes(termo) ||
        String(p.sobrenome || "").toLowerCase().includes(termo) ||
        String(p.cpf || "").toLowerCase().includes(termo) ||
        String(p.codigo_pedido || "").toLowerCase().includes(termo);

      if (!bate) return false;
    }

    if (tipoProduto && p.produto_tipo !== tipoProduto) return false;
    if (statusPagamento && p.status_pagamento !== statusPagamento) return false;
    if (statusRetirada && p.status_retirada !== statusRetirada) return false;

    if (!horarioDentroDoIntervalo(p.horario_retirada, horarioDe, horarioAte)) return false;

    if (!dataDentroDoIntervalo(p.created_at, compraDe, compraAte)) return false;
    if (!dataDentroDoIntervalo(p.data_pagamento, pagamentoDe, pagamentoAte)) return false;

    return true;
  });

  pedidosFiltrados = filtrados;
  renderPedidos(filtrados);
}

/* =========================================
   LIMPAR FILTROS
========================================= */
function limparFiltros() {

  document.getElementById("busca").value = "";
  document.getElementById("filtroTipoProduto").value = "";
  document.getElementById("filtroPagamento").value = "";
  document.getElementById("filtroRetirada").value = "";
  document.getElementById("filtroHorarioDe").value = "";
  document.getElementById("filtroHorarioAte").value = "";
  document.getElementById("filtroCompraDe").value = "";
  document.getElementById("filtroCompraAte").value = "";
  document.getElementById("filtroPagamentoDe").value = "";
  document.getElementById("filtroPagamentoAte").value = "";

  filtrarPedidos();
}

/* =========================================
   EXPORTAR CSV
========================================= */
function exportarCSV() {

  if (!pedidosFiltrados || !pedidosFiltrados.length) {
    alert("❌ Nenhum pedido para exportar (verifique os filtros aplicados).");
    return;
  }

  const cabecalho = [
    "ID",
    "Código Pedido",
    "Tipo de Produto",
    "Nome",
    "Sobrenome",
    "CPF",
    "Telefone",
    "Email",
    "Quantidade",
    "Valor Total",
    "Status Pagamento",
    "Status Retirada",
    "Data da Compra",
    "Data do Pagamento",
    "Horário Retirada",
    "Payment ID"
  ];

  const linhas = pedidosFiltrados.map(p => [
    p.id || "",
    p.codigo_pedido || "",
    p.produto_tipo || "",
    p.nome || "",
    p.sobrenome || "",
    p.cpf || "",
    p.telefone || "",
    p.email || "",
    p.quantidade || "",
    p.valor_total || "",
    p.status_pagamento || "",
    p.status_retirada || "",
    p.created_at || "",
    p.data_pagamento || "",
    p.horario_retirada || "",
    p.payment_id || ""
  ]);

  let csvConteudo = "";

  csvConteudo += cabecalho.join(";") + "\n";

  linhas.forEach(linha => {

    const linhaSegura = linha.map(valor =>
      `"${String(valor).replace(/"/g, '""')}"`
    );

    csvConteudo += linhaSegura.join(";") + "\n";
  });

  const blob = new Blob(
    ["\uFEFF" + csvConteudo],
    {
      type: "text/csv;charset=utf-8;"
    }
  );

  const link = document.createElement("a");

  const url = URL.createObjectURL(blob);

  const data = new Date();

  const nomeArquivo =
    `pedidos-fpss-${data.getFullYear()}-${String(data.getMonth()+1).padStart(2,"0")}-${String(data.getDate()).padStart(2,"0")}.csv`;

  link.setAttribute("href", url);
  link.setAttribute("download", nomeArquivo);

  document.body.appendChild(link);

  link.click();

  document.body.removeChild(link);
}

/* =========================================
   START
========================================= */
carregarPedidos();
</script>

</body>
</html>
