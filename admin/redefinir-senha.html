<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Redefinir Senha - FPSS</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Merriweather:wght@700;900&family=Roboto:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/admin-shared.css">

</head>

<body class="admin-page admin-auth">

<div class="box">

    <h2>Nova Senha</h2>

    <input
        type="password"
        id="senha"
        placeholder="Digite a nova senha"
    >

    <input
        type="password"
        id="confirmar"
        placeholder="Confirme a nova senha"
    >

    <button id="btnSalvar">

        ALTERAR SENHA

    </button>

    <div id="msg"></div>

</div>

<script src="/js/redefinir-senha.js"></script>

</body>

</html>
