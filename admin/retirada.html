<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Painel de Retirada FPSS</title>

  <script src="/js/html5-qrcode.min.js"></script>

  <style>
    *{
      box-sizing:border-box;
    }

    body{
      margin:0;
      font-family:Arial,sans-serif;
      background:#f4f4f4;
      padding:20px;
    }

    .container{
      max-width:850px;
      margin:auto;
      background:#fff;
      padding:30px;
      border-radius:15px;
      box-shadow:0 8px 25px rgba(0,0,0,0.12);
      border-top:5px solid #8b1111;
    }

    h1{
      text-align:center;
      color:#8b1111;
      margin-bottom:10px;
    }

    .sub{
      text-align:center;
      color:#666;
      margin-bottom:25px;
    }

    .top-nav{
      display:flex;
      flex-wrap:wrap;
      gap:10px;
      justify-content:center;
      margin-bottom:25px;
    }

    .top-nav a{
      text-decoration:none;
      background:#8b1111;
      color:#fff;
      padding:10px 16px;
      border-radius:10px;
      font-weight:bold;
    }

    .top-nav a:hover{
      opacity:0.92;
    }

    input{
      width:100%;
      padding:16px;
      font-size:18px;
      margin-top:10px;
      border:1px solid #ccc;
      border-radius:10px;
    }

    button{
      width:100%;
      padding:16px;
      margin-top:12px;
      border:none;
      border-radius:10px;
      font-size:18px;
      font-weight:bold;
      cursor:pointer;
      transition:0.3s;
    }

    .buscar{
      background:#8b1111;
      color:#fff;
    }

    .buscar:hover{
      background:#6f0d0d;
    }

    .retirar{
      background:#1d7f2a;
      color:#fff;
    }

    .retirar:hover{
      background:#16641f;
    }

    .resultado{
      margin-top:25px;
      padding:25px;
      background:#fafafa;
      border-radius:12px;
      display:none;
      border:1px solid #eee;
    }

    .erro{
      color:red;
      margin-top:15px;
      text-align:center;
      font-weight:bold;
    }

    .ok{
      color:green;
      font-weight:bold;
    }

    .status-pago{
      color:green;
      font-weight:bold;
    }

    .status-pendente{
      color:orange;
      font-weight:bold;
    }

    .status-retirado{
      color:red;
      font-weight:bold;
    }

    .linha{
      margin-bottom:10px;
      font-size:17px;
    }

    .alerta{
      margin-top:20px;
      background:#fff3cd;
      color:#856404;
      padding:12px;
      border-radius:8px;
      font-size:14px;
      line-height:1.4;
    }

    @media(max-width:768px){
      .container{
        padding:20px;
      }

      button{
        font-size:16px;
      }

      input{
        font-size:16px;
      }
    }

        .acoes-topo{
      display:flex;
      gap:10px;
      justify-content:center;
      margin-bottom:20px;
      flex-wrap:wrap;
    }

    .mini-btn{
      width:auto;
      padding:10px 16px;
      font-size:15px;
      border:none;
      border-radius:10px;
      font-weight:bold;
      cursor:pointer;
    }

    .qr-btn{
      background:#007bff;
      color:#fff;
    }

    .camera-btn{
      background:#444;
      color:#fff;
    }

    #scannerArea{
      margin-bottom:20px;
    }

    #reader{
      width:100%;
      max-width:280px;
      margin:0 auto;
      border:3px solid #8b1111;
      border-radius:14px;
      overflow:hidden;
      background:#000;
    }

    #reader video{
      width:100% !important;
      height:auto !important;
    }

  </style>
</head>
<body>

<div class="container">

  <h1>🍖 Painel de Retirada FPSS</h1>
  <p class="sub">
    <p class="sub">
  Escaneie QR Code automaticamente ou consulte por Código / CPF
</p>

<div class="acoes-topo">

  <button class="mini-btn qr-btn" onclick="toggleScanner()">
    📷 QR Scanner
  </button>

  <button class="mini-btn camera-btn" onclick="trocarCamera()">
    🔄 Trocar
  </button>

</div>

<div id="scannerArea" style="display:none;">
  <div id="reader"></div>
</div>
  </p>

  <div class="top-nav">
    <a href="/admin/dashboard.html">Admin Central</a>
    <a href="/admin/dashboard-metricas.html">Dashboard</a>
    <a href="/admin/pedidos.html">Pedidos</a>
    <a href="/admin/produtos.html">Produtos</a>
    <a href="/admin/leitor.html">Leitor QR</a>
    <a href="/index.html">Site Oficial</a>
  </div>

  <input
    type="text"
    id="busca"
    placeholder="Ex: FPSS-2027-CHU-000001 ou CPF"
  >

  <button class="buscar" onclick="buscarPedido()">
    🔎 BUSCAR PEDIDO
  </button>

  <div id="erro" class="erro"></div>

  <div id="resultado" class="resultado"></div>

</div>

<script>
const API_BASE = "https://fpss-backend.onrender.com";

let pedidoAtual = null;

/* =========================================
   BUSCAR PEDIDO
========================================= */
async function buscarPedido() {

  const termo = document.getElementById("busca").value.trim();
  const erro = document.getElementById("erro");
  const resultado = document.getElementById("resultado");

  erro.innerHTML = "";
  resultado.style.display = "none";

  if (!termo) {
    erro.innerHTML = "❌ Informe código ou CPF.";
    return;
  }

  try {

    let url = "";
    let buscaPorCodigo = false;

    /* =========================================
       DEFINIR TIPO DE BUSCA
    ========================================= */
    if (termo.toUpperCase().startsWith("FPSS-")) {

      buscaPorCodigo = true;

      url = `${API_BASE}/pedido/codigo/${encodeURIComponent(termo)}`;

    } else {

      url = `${API_BASE}/pedido/cpf/${termo.replace(/\D/g,'')}`;
    }

    const res = await fetch(url);
    const dados = await res.json();

    if (!dados.sucesso) {
      erro.innerHTML = "❌ Pedido não encontrado.";
      return;
    }

    /* =========================================
       BUSCA POR CÓDIGO (PEDIDO ÚNICO)
    ========================================= */
    if (buscaPorCodigo) {

      pedidoAtual = dados.pedido;

      /* =========================================
         VERIFICA PAGAMENTO EM TEMPO REAL
      ========================================= */
      if (pedidoAtual.payment_id) {

        try {

          const pagamentoRes = await fetch(
            `${API_BASE}/verificar-pagamento/${pedidoAtual.payment_id}`
          );

          const pagamentoDados = await pagamentoRes.json();

          if (pagamentoDados.sucesso) {
            pedidoAtual.status_pagamento = pagamentoDados.status_interno;
          }

        } catch (e) {
          console.log("Falha ao verificar pagamento em tempo real.");
        }
      }

      resultado.style.display = "block";

      resultado.innerHTML = `
        <h2>✅ Pedido Localizado</h2>

        <div class="linha"><strong>Nome:</strong> ${pedidoAtual.nome} ${pedidoAtual.sobrenome || ""}</div>

        <div class="linha"><strong>Código:</strong> ${pedidoAtual.codigo_pedido}</div>

        <div class="linha"><strong>CPF:</strong> ${pedidoAtual.cpf}</div>

        <div class="linha"><strong>Telefone:</strong> ${pedidoAtual.telefone || "Não informado"}</div>

        <div class="linha"><strong>Quantidade:</strong> ${pedidoAtual.quantidade}</div>

        <div class="linha"><strong>Horário:</strong> ${pedidoAtual.horario_retirada || "Não definido"}</div>

        <div class="linha">
          <strong>Status Pagamento:</strong>
          <span class="${
            pedidoAtual.status_pagamento === "pago"
              ? "status-pago"
              : "status-pendente"
          }">
            ${pedidoAtual.status_pagamento}
          </span>
        </div>

        <div class="linha">
          <strong>Status Retirada:</strong>
          <span class="${
            pedidoAtual.status_retirada === "retirado"
              ? "status-retirado"
              : "ok"
          }">
            ${pedidoAtual.status_retirada}
          </span>
        </div>

        ${
          pedidoAtual.status_retirada === "retirado"
            ? `<p class="erro">⚠️ Pedido já retirado.</p>`
            : pedidoAtual.status_pagamento !== "pago"
              ? `<p class="erro">⚠️ Pagamento pendente. Entrega bloqueada.</p>`
              : `<button class="retirar" onclick="confirmarRetirada()">✅ CONFIRMAR ENTREGA</button>`
        }

        <div class="alerta">
          ⚠️ Confirme nome + CPF antes de entregar.<br>
          Sem pagamento aprovado, a entrega permanece bloqueada.
        </div>
      `;

    } else {

      /* =========================================
         BUSCA POR CPF (MÚLTIPLOS PEDIDOS)
      ========================================= */

      const pedidos = dados.pedidos;

      resultado.style.display = "block";

      resultado.innerHTML = `
        <h2>📋 Pedidos encontrados (${pedidos.length})</h2>

        ${pedidos.map(pedido => `
          <div style="
            border:1px solid #ddd;
            border-radius:10px;
            padding:12px;
            margin-bottom:12px;
            background:${
              pedido.status_retirada === "retirado"
                ? "#ffe5e5"
                : pedido.status_pagamento === "pago"
                  ? "#e8f7e8"
                  : "#fff8d6"
            };
          ">

            <div><strong>Nome:</strong> ${pedido.nome} ${pedido.sobrenome || ""}</div>

            <div><strong>Código:</strong> ${pedido.codigo_pedido}</div>

            <div><strong>Quantidade:</strong> ${pedido.quantidade}</div>

            <div><strong>Horário:</strong> ${pedido.horario_retirada || "Não definido"}</div>

            <div><strong>Pagamento:</strong> ${pedido.status_pagamento}</div>

            <div><strong>Retirada:</strong> ${pedido.status_retirada}</div>

            ${
              pedido.status_retirada === "retirado"
                ? `<div class="bloqueio">⚠️ Já retirado</div>`
                : pedido.status_pagamento !== "pago"
                  ? `<div class="bloqueio">⚠️ Pagamento pendente</div>`
                  : `<button onclick="confirmarRetiradaPorCodigo('${pedido.codigo_pedido}')">✅ Confirmar Retirada</button>`
            }

          </div>
        `).join("")}
      `;
    }

  } catch (e) {

    erro.innerHTML = "❌ Erro ao buscar pedido.";
  }
}
/* =========================================
   CONFIRMAR RETIRADA
========================================= */
async function confirmarRetirada() {

  if (!pedidoAtual) return;

  const confirmar = confirm(
    `Confirmar entrega para ${pedidoAtual.nome}?\n\nCódigo: ${pedidoAtual.codigo_pedido}`
  );

  if (!confirmar) return;

  try {

    const res = await fetch(
      `${API_BASE}/retirada/${pedidoAtual.codigo_pedido}`,
      {
        method: "POST"
      }
    );

    const dados = await res.json();

    if (dados.sucesso) {

      alert("✅ Retirada confirmada com sucesso!");

      buscarPedido();

    } else {

      alert("❌ " + dados.erro);
    }

  } catch (e) {

    alert("❌ Erro ao confirmar retirada.");
  }
}

async function confirmarRetiradaPorCodigo(codigoPedido) {

  const confirmar = confirm(
    `Confirmar retirada do pedido ${codigoPedido}?`
  );

  if (!confirmar) return;

  try {

    const res = await fetch(
      `${API_BASE}/retirada/${codigoPedido}`,
      {
        method:"POST"
      }
    );

    const dados = await res.json();

    if (dados.sucesso) {

      alert("✅ Retirada confirmada com sucesso!");

      location.reload();

    } else {

      alert("❌ " + dados.erro);
    }

  } catch (e) {

    alert("❌ Erro ao confirmar retirada.");
  }
}

/* =========================================
   ENTER PARA BUSCA
========================================= */
document.getElementById("busca").addEventListener("keypress", function(e){
  if(e.key === "Enter"){
    buscarPedido();
  }
});
/* =========================================
   QR + CÂMERA
========================================= */
let html5QrCode = null;
let cameras = [];
let currentCameraIndex = 0;
let scannerAtivo = false;

async function toggleScanner() {

  const scannerArea = document.getElementById("scannerArea");

  if (scannerAtivo) {

    if (html5QrCode) {
      await html5QrCode.stop();
    }

    scannerArea.style.display = "none";
    scannerAtivo = false;
    return;
  }

  scannerArea.style.display = "block";

  try {

    html5QrCode = new Html5Qrcode("reader");

    cameras = await Html5Qrcode.getCameras();

    if (!cameras.length) {
      alert("❌ Nenhuma câmera encontrada.");
      return;
    }

    const traseiraIndex = cameras.findIndex(camera =>
      camera.label.toLowerCase().includes("back") ||
      camera.label.toLowerCase().includes("rear") ||
      camera.label.toLowerCase().includes("environment") ||
      camera.label.toLowerCase().includes("traseira")
    );

    currentCameraIndex = traseiraIndex >= 0 ? traseiraIndex : 0;

    await html5QrCode.start(
      { deviceId: { exact: cameras[currentCameraIndex].id } },
      {
        fps: 10,
        qrbox: { width: 220, height: 220 }
      },
      (decodedText) => {

        const codigo = decodedText.split("|")[0];

        document.getElementById("busca").value = codigo;

        buscarPedido();
      }
    );

    scannerAtivo = true;

  } catch (err) {

    alert("❌ Erro ao iniciar câmera.");
  }
}

async function trocarCamera() {

  if (!scannerAtivo || cameras.length < 2) {
    return;
  }

  try {

    await html5QrCode.stop();

    currentCameraIndex =
      (currentCameraIndex + 1) % cameras.length;

    await html5QrCode.start(
      { deviceId: { exact: cameras[currentCameraIndex].id } },
      {
        fps: 10,
        qrbox: { width: 220, height: 220 }
      },
      (decodedText) => {

        const codigo = decodedText.split("|")[0];

        document.getElementById("busca").value = codigo;

        buscarPedido();
      }
    );

  } catch (err) {

    alert("❌ Erro ao trocar câmera.");
  }
}
</script>

</body>
</html>
