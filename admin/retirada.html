<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Painel de Retirada FPSS</title>

  <script src="../js/html5-qrcode.min.js"></script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Merriweather:wght@700;900&family=Roboto:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="../css/admin-shared.css">
  <link rel="stylesheet" href="../css/retirada.css">
  <link rel="icon" type="image/png" href="/assets/icons/favicon.png">
  
</head>
<body class="admin-page">

<div class="container">

  <h1>🍖 Painel de Retirada FPSS</h1>

  <p class="sub">
    Escaneie QR Code automaticamente ou consulte por Código / CPF
  </p>

    <div class="menu-admin">
    <a href="/admin/dashboard.html">Admin Central</a>
    <a href="/admin/dashboard-metricas.html">Dashboard</a>
    <a href="/admin/produtos.html">Produtos</a>
    <a href="/admin/parceiros.html">Parceiros</a>
    <a href="/admin/pedidos.html">Pedidos</a>
    <a href="/admin/retirada.html" class="ativo">Retirada</a>
    <a href="/admin/leitor.html">Leitor</a>
    <a href="/">Site Oficial</a>
  </div>

  <div class="busca-linha">

    <input
      type="text"
      id="busca"
      placeholder="Código FPSS ou CPF"
    >

    <button class="mini-btn qr-btn" onclick="toggleScanner()">
      📷
    </button>

    <button class="mini-btn camera-btn" onclick="trocarCamera()">
      🔄
    </button>

  </div>

  <div class="acoes-busca">

    <button class="buscar" onclick="buscarPedido()">
      🔎 BUSCAR
    </button>

    <button class="limpar-btn" onclick="limparTela()">
      🧹 LIMPAR
    </button>

  </div>

  <div id="scannerArea" style="display:none;">
    <div id="reader"></div>
  </div>

  <div id="erro" class="erro"></div>

  <div id="resultado" class="resultado"></div>

</div>

<script src="../js/retirada.js"></script>

</body>
</html>
