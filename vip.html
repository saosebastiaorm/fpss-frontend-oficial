<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Grupo VIP FPSS</title>

<link rel="stylesheet" href="css/vip.css">

</head>

<body>

<section class="vip-fpss">

  <div class="vip-box">

    <h2>🔥 GRUPO VIP FPSS</h2>

    <p>Receba novidades da festa em primeira mão</p>

    <form id="formVIP">

      <!-- ORIGEM -->
      <input type="hidden" name="origem" value="VIP">

      <!-- NOME -->
      <div class="vip-form-group">
        <label for="vip-nome">Nome Completo</label>
        <input
          type="text"
          id="vip-nome"
          name="nome"
          placeholder="Digite seu nome completo"
          required>
      </div>

      <!-- WHATSAPP -->
      <div class="vip-form-group">
        <label for="vip-whatsapp">WhatsApp</label>
        <input
          type="tel"
          id="vip-whatsapp"
          name="whatsapp"
          placeholder="(69) 99999-9999"
          required>
      </div>

      <!-- CIDADE -->
      <div class="vip-form-group">
        <label for="vip-cidade">Cidade</label>
        <input
          type="text"
          id="vip-cidade"
          name="cidade"
          placeholder="Sua cidade"
          required>
      </div>

      <!-- BAIRRO -->
      <div class="vip-form-group">
        <label for="vip-bairro">Bairro</label>
        <input
          type="text"
          id="vip-bairro"
          name="bairro"
          placeholder="Seu bairro"
          required>
      </div>

      <!-- BOTÃO -->
      <button type="submit">
        ENTRAR NO VIP 🚀
      </button>

    </form>

    <!-- MENSAGEM -->
    <div id="msgVIP"></div>

  </div>

</section>

<script src="js/vip.js"></script>

</body>
</html>
